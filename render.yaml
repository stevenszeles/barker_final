services:
  - type: web
    name: barker-dashboard
    runtime: docker
    plan: free
    autoDeploy: false
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: WS_DB_FALLBACK_TO_SQLITE
        value: "0"
      - key: BARKER_AUTH_ENABLED
        value: "1"
      - key: BARKER_SECURE_COOKIES
        value: "1"
      - key: BARKER_AUTH_SECRET
        generateValue: true
      - key: BARKER_ADMIN_PASSWORD
        sync: false
      - key: BARKER_VIEWER_PASSWORD
        sync: false

services:
  - type: web
    name: barker-dashboard
    runtime: docker
    plan: free
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    maxShutdownDelaySeconds: 30
    envVars:
      # Optional. Point this at a Postgres instance and uploaded CSVs survive
      # restarts. Left unset, the app runs on SQLite, which the free plan wipes
      # whenever the service restarts.
      - key: DATABASE_URL
        sync: false
